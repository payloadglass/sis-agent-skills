name: Release SIS Agent Skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'evals/**'
      - 'manifest.json'
      - 'compatibility.json'
      - '.claude-plugin/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Pack version without a leading v
        required: true
        default: 0.2.0
  push:
    tags:
      - 'v*'

jobs:
  package:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="0.2.0-pr${{ github.event.pull_request.number }}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate pack
        run: python3 scripts/validate_pack.py

      - name: Compile Python helpers
        run: python3 -m compileall -q scripts skills

      - name: Check shell helpers
        shell: bash
        run: |
          set -euo pipefail
          bash -n skills/sis-corpus-index/scripts/sync_index.sh
          bash -n skills/sis-corpus-hunt/scripts/query_index.sh
          bash -n skills/sis-setup/scripts/check_sis.sh
          bash -n skills/sis-setup/scripts/install_verified.sh

      - name: Smoke-test helper behavior
        run: python3 scripts/smoke_test.py

      - name: Build release assets
        run: python3 scripts/build_release.py --version "${{ steps.version.outputs.version }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sis-agent-skills-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          name: sis-agent-skills-${{ needs.package.outputs.version }}
          path: dist

      - name: Attach assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/skills/*.zip
            dist/SHA256SUMS
